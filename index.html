<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zmajevi App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;--bg4:#222f45;
  --gold:#f5c518;--gold2:#e6b800;
  --white:#f1f5ff;--gray:#7a8aaa;--gray2:#4a5568;
  --red:#ff4757;--green:#2ed573;--blue:#4facfe;--purple:#a78bfa;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
}
body{background:#060b14;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:'Inter',sans-serif;padding:24px 12px}
input,textarea,button{font-family:'Inter',sans-serif}
a{text-decoration:none;color:inherit}
.phone{width:393px;height:852px;background:var(--bg);border-radius:52px;overflow:hidden;position:relative;
  box-shadow:0 60px 120px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.06);display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.active{display:flex}

/* AUTH */
#s-auth{background:linear-gradient(160deg,#0d1528 0%,#0a0f1e 60%);overflow-y:auto;padding:0 0 40px}
.auth-hero{padding:52px 28px 28px;text-align:center}
.auth-logo{width:76px;height:76px;border-radius:22px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 18px;box-shadow:0 12px 40px rgba(245,197,24,.45)}
.auth-appname{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;color:var(--gold);letter-spacing:5px}
.auth-tagline{color:var(--gray);font-size:13px;margin-top:6px}
.auth-body{padding:0 22px}
.auth-tabs{display:flex;background:var(--bg3);border-radius:16px;padding:4px;margin-bottom:22px;border:1px solid var(--border)}
.atab{flex:1;padding:12px;border-radius:13px;border:none;background:none;cursor:pointer;font-weight:700;font-size:14px;color:var(--gray);transition:all .25s}
.atab.on{background:var(--gold);color:#0a0f1e;box-shadow:0 4px 16px rgba(245,197,24,.35)}
.acard{background:var(--bg2);border-radius:22px;padding:24px;border:1px solid var(--border)}
.alabel{color:var(--gray);font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin:16px 0 7px}
.alabel:first-child{margin-top:0}
.ainput{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:13px;padding:14px 16px;color:var(--white);font-size:15px;outline:none;transition:border-color .2s}
.ainput:focus{border-color:var(--gold)}
.ainput::placeholder{color:var(--gray2)}
.aerr{color:var(--red);font-size:13px;margin-top:10px;display:none;padding:10px 13px;background:rgba(255,71,87,.1);border-radius:10px;border:1px solid rgba(255,71,87,.2)}
.abtn{width:100%;margin-top:20px;background:var(--gold);border:none;border-radius:15px;padding:17px;font-size:15px;font-weight:800;color:#0a0f1e;cursor:pointer;transition:all .2s;letter-spacing:.5px;box-shadow:0 8px 24px rgba(245,197,24,.4)}
.alink{text-align:center;margin-top:14px;color:var(--gold);font-size:13px;cursor:pointer;font-weight:500}
.afooter{color:var(--gray2);font-size:11px;text-align:center;margin-top:22px;line-height:1.7;padding:0 10px}

/* MAIN */
#s-main{background:var(--bg)}
.topbar{background:rgba(10,15,30,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 18px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-icon{width:34px;height:34px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px}
.topbar-title{font-family:'Barlow Condensed',sans-serif;color:var(--gold);font-size:17px;font-weight:900;letter-spacing:2px}
.topbar-sub{color:var(--gray);font-size:9px;margin-top:1px}
.topbar-right{display:flex;gap:8px;align-items:center}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.user-pill{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:4px 10px 4px 5px;cursor:pointer}
.user-pill:hover{border-color:rgba(245,197,24,.4)}
.uavatar{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#0a0f1e}
.uname{color:var(--white);font-size:12px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column}
.tab-panel{display:none;flex:1;overflow-y:auto;padding:0 0 90px}
.tab-panel.on{display:block}

/* BOTTOM NAV */
.bnav{display:flex;background:rgba(10,15,30,.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:8px 0 16px;flex-shrink:0}
.nbtn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.nicon{font-size:20px;transition:transform .2s}
.nlabel{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--gray);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.nbtn.on .nlabel{color:var(--gold)}
.nbtn.on .nicon{transform:scale(1.15)}
.ndot{width:16px;height:2.5px;border-radius:2px;background:var(--gold);margin-top:1px}

/* NEWS TAB */
.news-sticky{position:sticky;top:0;z-index:5;background:var(--bg)}
.news-hdr{background:linear-gradient(135deg,#0d1528,#111827);border-bottom:2px solid var(--gold);padding:12px 16px 10px}
.news-hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.35);border-radius:20px;padding:4px 10px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 1.3s infinite}
.live-txt{color:var(--red);font-size:10px;font-weight:800;letter-spacing:1px}
.rfbtn{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--gray);transition:all .2s;user-select:none}
.rfbtn:hover{color:var(--gold)}
.rfbtn.spin{animation:spin .6s linear}
.src-label{color:var(--gray2);font-size:9px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:7px}
.src-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.spill{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;transition:all .2s;flex-shrink:0;user-select:none}
.spill.on{border-color:var(--gold);background:rgba(245,197,24,.1)}
.spill.on .sn{color:var(--gold)}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sn{color:var(--gray);font-size:10px;font-weight:600}
.news-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 0;background:var(--bg)}
.nfc{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:11px;font-weight:600;color:var(--gray);cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0;user-select:none}
.nfc.on{background:var(--gold);color:#0a0f1e;border-color:var(--gold);font-weight:700}
.news-feed{padding:12px 14px 8px}
.feat-card{display:block;background:var(--bg2);border-radius:20px;overflow:hidden;margin-bottom:11px;border:1px solid var(--border);transition:border-color .2s,transform .15s}
.feat-card:hover{border-color:rgba(245,197,24,.3);transform:translateY(-1px)}
.feat-card.hot{border-color:rgba(245,197,24,.22)}
.feat-img{width:100%;height:120px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:54px}
.feat-body{padding:13px 15px}
.cmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.csrc{display:flex;align-items:center;gap:5px}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cname{color:var(--gray);font-size:11px;font-weight:600}
.ctime{color:var(--gray2);font-size:10px}
.ctag-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.brk-row{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.brk-d{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.3s infinite}
.brk-t{color:var(--red);font-size:10px;font-weight:800;letter-spacing:2px}
.feat-title{color:var(--white);font-size:15px;font-weight:800;line-height:1.45;margin-bottom:7px}
.feat-desc{color:var(--gray);font-size:12px;line-height:1.55;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat-foot{display:flex;align-items:center;gap:9px;border-top:1px solid var(--border);padding-top:10px}
.n-like{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--gray);font-size:12px;font-weight:600;transition:color .2s;padding:3px 0}
.n-like:hover,.n-like.liked{color:var(--gold)}
.n-open{margin-left:auto;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);border-radius:9px;padding:6px 12px;color:var(--gold);font-size:11px;font-weight:700;flex-shrink:0}
.comp-card{display:flex;gap:11px;background:var(--bg2);border-radius:16px;padding:12px 13px;margin-bottom:9px;border:1px solid var(--border);transition:border-color .2s,transform .15s;align-items:flex-start}
.comp-card:hover{border-color:var(--border2);transform:translateX(2px)}
.comp-card.hot{border-color:rgba(245,197,24,.18)}
.comp-emoji{width:46px;height:46px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--border)}
.comp-body{flex:1;min-width:0}
.comp-title{color:var(--white);font-size:13px;font-weight:700;line-height:1.4;margin-bottom:7px}
.comp-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.comp-read{color:var(--gold);font-size:11px;font-weight:700;margin-left:auto;flex-shrink:0}
.skel{background:var(--bg2);border-radius:16px;padding:14px;margin-bottom:9px;border:1px solid var(--border)}
.sl{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200%;border-radius:6px;height:11px;margin-bottom:8px;animation:shimmer 1.5s infinite}
.sl.t{height:15px;width:94%}.sl.w{width:84%}.sl.m{width:62%}.sl.s{width:40%}
.news-hint{text-align:center;padding:8px 14px 12px;color:var(--gray2);font-size:10px}

/* SPIELER TAB */
.spieler-pad{padding:16px 14px 0}
.pcard{background:var(--bg2);border-radius:16px;padding:14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:13px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.pcard:hover{border-color:rgba(245,197,24,.3);transform:translateX(2px)}
.pemoji{width:46px;height:46px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid rgba(245,197,24,.2);overflow:hidden}
.pemoji img{width:100%;height:100%;object-fit:cover}
.pname{color:var(--white);font-weight:700;font-size:15px}
.pmeta{color:var(--gray);font-size:11px;margin-top:2px}
.pcaps{text-align:right;margin-right:4px}
.pcnum{color:var(--gold);font-weight:900;font-size:22px;font-family:'Barlow Condensed',sans-serif;line-height:1}
.pclabel{color:var(--gray);font-size:10px}
.grp-label{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:2px;margin:14px 0 9px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.api-badge{color:var(--gold);background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.load-bar{height:3px;background:linear-gradient(90deg,var(--gold),transparent);border-radius:2px;animation:loadBar 1.5s ease-in-out infinite}
.phero{background:linear-gradient(140deg,var(--bg3),var(--bg2));border-radius:22px;padding:28px;text-align:center;margin-bottom:14px;border:1px solid rgba(245,197,24,.2)}
.photo-big{width:80px;height:80px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px;border:2px solid rgba(245,197,24,.4);overflow:hidden}
.photo-big img{width:100%;height:100%;object-fit:cover}
.phname{font-family:'Barlow Condensed',sans-serif;color:var(--gold);font-size:30px;font-weight:900;letter-spacing:1.5px}
.phsub{color:var(--gray);font-size:13px;margin-top:5px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.scard{background:var(--bg2);border-radius:14px;padding:16px;text-align:center;border:1px solid var(--border)}
.snum{color:var(--gold);font-size:34px;font-weight:900;font-family:'Barlow Condensed',sans-serif;line-height:1}
.slabel{color:var(--gray);font-size:12px;margin-top:4px}
.fbox{background:var(--bg2);border-radius:14px;padding:16px;border:1px solid var(--border)}
.ftitle{color:var(--white);font-size:13px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.fdots{display:flex;gap:7px}
.fdot{flex:1;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.fdot.w{background:rgba(46,213,115,.15);border:1px solid rgba(46,213,115,.35);color:var(--green)}
.fdot.l{background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.35);color:var(--red)}
.fdot.d{background:rgba(122,138,170,.15);border:1px solid rgba(122,138,170,.3);color:var(--gray)}

/* SPIELE */
.spiele-pad{padding:16px 14px 0}
.seclabel{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:13px;font-family:'Barlow Condensed',sans-serif}

/* BIHBOOK */
.bihbook-pad{padding:16px 14px 0}
.stories{display:flex;gap:10px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.story-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--gold),#ff6b35);position:relative}
.story-ring.add{background:var(--bg3);border:2px dashed var(--border2)}
.story-av{width:100%;height:100%;border-radius:50%;background:var(--bg3);border:2.5px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--gold)}
.story-lbl{color:var(--gray);font-size:10px;font-weight:600;max-width:60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-pin{background:linear-gradient(135deg,#1a2f5e,#0f1f3d);border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid rgba(79,172,254,.3);position:relative;overflow:hidden}
.admin-pin::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--gold))}
.admin-badge{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.admin-icon{background:var(--gold);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.admin-label{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.5px}
.admin-expires{color:var(--gray);font-size:10px;margin-left:auto}
.admin-title{color:var(--white);font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4}
.admin-body{color:var(--gray);font-size:13px;line-height:1.55}
.vote-options{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.vote-opt{background:var(--bg3);border:1px solid var(--border2);border-radius:11px;padding:10px 14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
.vote-opt:hover{border-color:rgba(245,197,24,.4);background:rgba(245,197,24,.07)}
.vote-opt.voted{border-color:var(--gold);background:rgba(245,197,24,.12)}
.vote-label{color:var(--white);font-size:13px;font-weight:600}
.vote-bar-wrap{height:4px;background:var(--bg4);border-radius:2px;margin-top:7px;overflow:hidden}
.vote-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold),#ff9500);transition:width .6s ease}
.vote-pct{color:var(--gold);font-size:11px;font-weight:700}
.compose{background:var(--bg2);border-radius:20px;padding:16px;margin-bottom:14px;border:1px solid var(--border)}
.compose-top{display:flex;gap:12px;align-items:flex-start}
.cavatar{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0a0f1e;flex-shrink:0;border:2px solid rgba(245,197,24,.3)}
.carea{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;color:var(--white);font-size:14.5px;outline:none;resize:none;height:52px;transition:all .25s;line-height:1.5}
.carea:focus{height:90px;border-color:rgba(245,197,24,.35);background:var(--bg)}
.carea::placeholder{color:var(--gray2)}
.compose-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}
.ctool{background:none;border:none;cursor:pointer;color:var(--gray);font-size:20px;padding:6px;border-radius:9px;transition:all .2s}
.cpost{background:var(--gold);color:#0a0f1e;border:none;border-radius:12px;padding:9px 22px;font-weight:800;font-size:13px;cursor:pointer;transition:all .2s}
.cpost:disabled{opacity:.4}
.fpost{background:var(--bg2);border-radius:20px;margin-bottom:12px;border:1px solid var(--border);overflow:hidden}
.fpost-header{display:flex;align-items:center;gap:11px;padding:14px 16px 0}
.favatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--bg3),var(--bg4));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--gold);flex-shrink:0;border:1.5px solid rgba(245,197,24,.2)}
.fuser{flex:1}
.fdisplay{color:var(--white);font-weight:700;font-size:14.5px}
.fusername{color:var(--gray);font-size:12px;margin-top:2px}
.fmore{background:none;border:none;cursor:pointer;color:var(--gray);font-size:22px;padding:4px 8px;border-radius:8px;line-height:1}
.ftext{padding:12px 16px;color:var(--white);font-size:14.5px;line-height:1.6;word-break:break-word}
.factions{display:flex;align-items:center;padding:10px 14px 12px;gap:4px;border-top:1px solid var(--border)}
.fact{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:11px;color:var(--gray);font-size:13px;font-weight:600;transition:all .2s}
.fact:hover{background:var(--bg3);color:var(--white)}
.fact.liked{color:var(--gold)}
.fact-share{margin-left:auto}

/* TRANSFERS */
.tr-pad{padding:16px 14px 0}
.trcard{background:var(--bg2);border-radius:18px;padding:16px;margin-bottom:11px;border:1px solid var(--border)}
.trplayer{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tremoji{font-size:30px}
.trname{color:var(--white);font-weight:700;font-size:15px}
.trpos{color:var(--gray);font-size:11px;margin-top:2px}
.trstatus{margin-left:auto;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700}
.trconfirmed{background:rgba(46,213,115,.15);color:var(--green);border:1px solid rgba(46,213,115,.3)}
.trrumor{background:rgba(122,138,170,.15);color:var(--gray);border:1px solid var(--border2)}
.trarrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trclub{background:var(--bg3);border-radius:9px;padding:7px 12px;color:var(--white);font-size:12px;font-weight:600;border:1px solid var(--border)}
.trarricon{color:var(--gold);font-size:18px}
.trfee{margin-top:10px;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.25);border-radius:9px;padding:6px 12px;display:inline-block}
.trfeetxt{color:var(--gold);font-size:12px;font-weight:700}

/* PROFILE */

.prof-un{color:var(--gold);font-size:14px;margin-top:3px}

.prof-stats{display:flex;justify-content:center;margin-top:18px}
.pstat{text-align:center;flex:1}
.pstat+.pstat{border-left:1px solid var(--border)}
.pstat-num{color:var(--white);font-size:20px;font-weight:800}
.pstat-lbl{color:var(--gray);font-size:11px;margin-top:2px}
.edit-form{padding:20px 20px 80px}
.ef-label{color:var(--gray);font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin:18px 0 8px}
.ef-label:first-child{margin-top:0}
.ef-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:13px;padding:13px 15px;color:var(--white);font-size:14.5px;outline:none;transition:border-color .2s}
.ef-input:focus{border-color:var(--gold)}
.ef-hint{color:var(--gray2);font-size:11px;margin-top:5px;padding-left:2px}
.ef-save{width:100%;margin-top:22px;background:var(--gold);border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;color:#0a0f1e;cursor:pointer}
.ef-logout{width:100%;margin-top:10px;background:none;border:1px solid rgba(255,71,87,.3);border-radius:14px;padding:15px;font-size:14px;font-weight:700;color:var(--red);cursor:pointer}

/* COMMENTS MODAL */
.modal{display:none;position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:flex-end;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.csheet{background:var(--bg2);border-radius:26px 26px 0 0;width:100%;max-height:76%;display:flex;flex-direction:column;border-top:1px solid var(--border2)}
.chandle{width:36px;height:4px;border-radius:2px;background:var(--gray2);margin:12px auto 4px}
.chdr{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 14px;border-bottom:1px solid var(--border)}
.chtitle{color:var(--white);font-weight:800;font-size:17px}
.chclose{background:var(--bg3);border:none;color:var(--gray);font-size:18px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.clist{flex:1;overflow-y:auto;padding:14px 16px}
.citem{display:flex;gap:10px;margin-bottom:14px}
.cbubble{flex:1;background:var(--bg3);border-radius:0 15px 15px 15px;padding:10px 13px;border:1px solid var(--border)}
.cuser{color:var(--gold);font-weight:700;font-size:12px;margin-bottom:3px}
.ctext{color:var(--white);font-size:13.5px;line-height:1.45}
.cinput-row{display:flex;gap:9px;align-items:center;padding:12px 14px;border-top:1px solid var(--border)}
.cinput{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:22px;padding:10px 16px;color:var(--white);font-size:13.5px;outline:none}
.csend{background:var(--gold);width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:17px;font-weight:900;color:#0a0f1e;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* TABELLEN */
.league-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.ltab{display:flex;align-items:center;gap:5px;background:var(--bg3);color:var(--gray);border:1px solid var(--border);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;transition:all .2s}
.ltab.on{background:var(--gold);color:#0a0f1e;border-color:var(--gold)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes loadBar{0%{width:0%;opacity:1}80%{width:100%;opacity:1}100%{width:100%;opacity:0}}
.fu{animation:fadeUp .28s ease forwards}

function switchAuth(mode) {
  document.querySelectorAll('.atab').forEach(function(t,i) {
    t.classList.toggle('on', (mode==='login'&&i===0)||(mode==='reg'&&i===1));
  });
  renderAuthForm(mode);
}

function renderAuthForm(mode) {
  var f = document.getElementById('aform');
  var h = '';
  if (mode === 'reg') {
    h += '<div class="alabel">Vollständiger Name</div><input class="ainput" type="text" id="f-name" placeholder="z.B. Kemal Mustafić">';
    h += '<div class="alabel">Benutzername</div><input class="ainput" type="text" id="f-uname" placeholder="@dein_name (für Login)">';
  }
  h += '<div class="alabel">E-Mail</div><input class="ainput" type="email" id="f-email" placeholder="email@example.com">';
  h += '<div class="alabel">Passwort</div><input class="ainput" type="password" id="f-pass" placeholder="••••••••">';
  if (mode === 'reg') {
    h += '<div class="alabel">Passwort bestätigen</div><input class="ainput" type="password" id="f-pass2" placeholder="••••••••">';
  }
  h += '<div class="aerr" id="aerr"></div>';
  h += '<button class="abtn" onclick="doAuth(\'' + mode + '\')">' + (mode==='login'?'ANMELDEN':'KONTO ERSTELLEN') + '</button>';
  if (mode === 'login') h += '<div class="alink">Passwort vergessen?</div>';
  f.innerHTML = h;
}

function showErr(msg) {
  var e = document.getElementById('aerr');
  e.textContent = '⚠️ ' + msg;
  e.style.display = 'block';
}

function doAuth(mode) {
  var emailEl = document.getElementById('f-email');
  var passEl = document.getElementById('f-pass');
  var email = emailEl ? emailEl.value.trim() : '';
  var pass = passEl ? passEl.value : '';
  if (!email || !pass) { showErr('Bitte alle Felder ausfüllen.'); return; }

  if (mode === 'reg') {
    var nameEl = document.getElementById('f-name');
    var unameEl = document.getElementById('f-uname');
    var pass2El = document.getElementById('f-pass2');
    var name = nameEl ? nameEl.value.trim() : '';
    var uname = unameEl ? unameEl.value.trim().replace('@','') : '';
    var pass2 = pass2El ? pass2El.value : '';
    if (!name || !uname) { showErr('Name und Benutzername sind Pflichtfelder.'); return; }
    if (pass !== pass2) { showErr('Passwörter stimmen nicht überein.'); return; }
    if (pass.length < 6) { showErr('Passwort mind. 6 Zeichen.'); return; }
    if (USERS[email]) { showErr('E-Mail bereits verwendet.'); return; }
    USERS[email] = {name:name, username:uname, email:email, password:pass, bio:'Zmajevi-Fan 🐉🇧🇦', posts:0, joinedAt:'2026'};
    ME = USERS[email];
  } else {
    var found = USERS[email] || null;
    if (!found) {
      var vals = Object.values(USERS);
      for (var i=0; i<vals.length; i++) {
        if (vals[i].username === email) { found = vals[i]; break; }
      }
    }
    if (!found || found.password !== pass) {
      showErr('Benutzername / E-Mail oder Passwort falsch. (Demo: erst registrieren!)');
      return;
    }
    ME = found;
  }
  enterApp();
}

function enterApp() {
  document.getElementById('s-auth').classList.remove('active');
  document.getElementById('s-main').classList.add('active');
  renderUserPill();
  renderAll();
}

function renderUserPill() {
  var ini = ME.name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  document.getElementById('upill').innerHTML =
    '<div class="user-pill" onclick="openProfile()"><div class="uavatar">' + ini + '</div><span class="uname">@' + ME.username + '</span></div>';
}

function fetchPlayersFromAPI() {
  var inner = document.getElementById('spieler-inner');
  inner.innerHTML = '<div style="padding:20px 0">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
    '<div style="color:var(--gold);font-size:13px;font-weight:700">🤖 API-Football wird abgerufen...</div></div>' +
    '<div class="load-bar" style="margin-bottom:20px"></div>' +
    Array(6).fill(0).map(function(){return '<div class="skel"><div class="sl s"></div><div class="sl t"></div><div class="sl m"></div></div>';}).join('') +
    '</div>';

  var proxyUrl = 'https://corsproxy.io/?';
  var apiUrl = 'https://v3.football.api-sports.io/players/squads?team=' + BIH_TEAM_ID;

  fetch(proxyUrl + encodeURIComponent(apiUrl), {
    headers: {'x-apisports-key': API_KEY}
  }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(data) {
    var rawPlayers = data && data.response && data.response[0] && data.response[0].players;
    if (rawPlayers && rawPlayers.length) {
      var posMap = {'Goalkeeper':'Golmani','Defender':'Odbrana','Midfielder':'Vezni red','Attacker':'Napadači'};
      var posShort = {'Goalkeeper':'GK','Defender':'CB','Midfielder':'CM','Attacker':'ST'};
      var emojiMap = {'Goalkeeper':'🧤','Defender':'🏔️','Midfielder':'⚡','Attacker':'🎯'};
      PLAYERS = rawPlayers.map(function(p, i) {
        var grp = posMap[p.position] || 'Vezni red';
        var flag = emojiMap[p.position] || '👤';
        if (p.name && (p.name.includes('Džeko')||p.name.includes('Dzeko'))) flag = '🐉';
        if (p.name && (p.name.includes('Pjanić')||p.name.includes('Pjanic'))) flag = '⭐';
        var fb = FALLBACK_PLAYERS.find(function(f) {
          return f.name.toLowerCase().replace(/[^a-z]/g,'').indexOf(p.name.toLowerCase().replace(/[^a-z]/g,'').slice(0,6)) !== -1;
        });
        return {
          id: p.id || (i+1), grp:grp, name:p.name,
          pos: posShort[p.position] || 'CM',
          club: fb ? fb.club : '—',
          caps: fb ? fb.caps : 0, goals: fb ? fb.goals : 0,
          flag:flag, form: fb ? fb.form : [null,null,null,null,null],
          photo: p.photo || ''
        };
      });
      renderPlayersInner();
    } else {
      throw new Error('Keine Spieler');
    }
  }).catch(function(err) {
    console.warn('API Fallback:', err.message);
    PLAYERS = FALLBACK_PLAYERS;
    renderPlayersInner();
  });
  playersLoaded = true;
}

function fetchSpiele() {
  var inner = document.getElementById('spiele-inner');
  inner.innerHTML = '<div style="padding:20px 0">' +
    '<div class="live-pill" style="margin-bottom:12px"><div class="live-dot"></div><span class="live-txt">API-FOOTBALL</span></div>' +
    '<div class="load-bar" style="margin-bottom:16px"></div>' +
    Array(3).fill(0).map(function(){return '<div class="skel"><div class="sl s"></div><div class="sl t"></div><div class="sl m"></div></div>';}).join('') +
    '</div>';

  var proxy = 'https://corsproxy.io/?';
  var headers = {'x-apisports-key': API_KEY};

  Promise.all([
    fetch(proxy + encodeURIComponent('https://v3.football.api-sports.io/fixtures?team='+BIH_TEAM_ID+'&live=all'), {headers:headers}),
    fetch(proxy + encodeURIComponent('https://v3.football.api-sports.io/fixtures?team='+BIH_TEAM_ID+'&next=8'), {headers:headers}),
    fetch(proxy + encodeURIComponent('https://v3.football.api-sports.io/fixtures?team='+BIH_TEAM_ID+'&last=6'), {headers:headers})
  ]).then(function(responses) {
    return Promise.all(responses.map(function(r){return r.json();}));
  }).then(function(results) {
    var live = (results[0]&&results[0].response) || [];
    var next = (results[1]&&results[1].response) || [];
    var last = (results[2]&&results[2].response) || [];
    if (live.length || next.length || last.length) {
      renderSpieleFull(live, next, last);
    } else {
      renderSpieleOffline();
    }
  }).catch(function() {
    renderSpieleOffline();
  });
}

function renderSpieleFull(live, next, last) {
  var html = '';
  if (live.length) {
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">' +
      '<div class="live-pill"><div class="live-dot"></div><span class="live-txt">LIVE JETZT</span></div>' +
      '<span style="color:var(--gray2);font-size:10px">Aktualisiert alle 30 Sek.</span></div>';
    live.forEach(function(f){ html += buildFixtureCard(f,'live'); });
  }
  if (next.length) {
    html += '<div class="seclabel" style="' + (live.length?'margin-top:16px':'') + '">NÄCHSTE SPIELE</div>';
    next.forEach(function(f){ html += buildFixtureCard(f,'next'); });
  }
  if (last.length) {
    html += '<div class="seclabel" style="margin-top:16px">LETZTE ERGEBNISSE</div>';
    last.slice().reverse().forEach(function(f){ html += buildFixtureCard(f,'last'); });
  }
  html += renderStandingsHTML();
  document.getElementById('spiele-inner').innerHTML = html;
}

function buildFixtureCard(f, mode) {
  var fix = f.fixture, teams = f.teams, goals = f.goals, league = f.league;
  var isBihHome = teams.home.id === BIH_TEAM_ID;
  var oppTeam = isBihHome ? teams.away : teams.home;
  var bihGoals = isBihHome ? goals.home : goals.away;
  var oppGoals = isBihHome ? goals.away : goals.home;
  var bihTeam = isBihHome ? teams.home : teams.away;
  var dt = new Date(fix.date);
  var dateStr = dt.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
  var timeStr = dt.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  var status = fix.status.short;
  var elapsed = fix.status.elapsed;
  var isFinished = ['FT','AET','PEN'].includes(status);
  var resultClass = 'draw';
  if (isFinished) {
    if (bihTeam.winner === true) resultClass = 'win';
    else if (bihTeam.winner === false) resultClass = 'loss';
  }
  if (mode === 'live') {

function togglePostBtn() {
  var v = document.getElementById('carea');

}

function renderFeedHTML() {
  return FEED.map(function(p) {
    return '<div class="fpost fu">' +
      '<div class="fpost-header"><div class="favatar">' + p.initials + '</div>' +
      '<div class="fuser"><div class="fdisplay">' + p.display + '</div><div class="fusername">@' + p.user + ' · ' + p.time + '</div></div>' +

      '<div class="ftext">' + p.text + '</div>' +
      '<div class="factions">' +
      '<button class="fact' + (p.liked?' liked':'') + '" onclick="likePost(' + p.id + ',this)">' + (p.liked?'❤️':'🤍') + ' <span>' + p.likes + '</span></button>' +
      '<button class="fact" onclick="openComments(' + p.id + ')">💬 <span>' + p.comments.length + '</span></button>' +
      '<button class="fact fact-share">↗ Teilen</button>' +
      '</div></div>';
  }).join('');

function doVote(i) {
  if (votedPoll !== null) return;
  votedPoll = i;
  ADMIN_POSTS[0].options[i].votes += 1;
  renderBihbook();
}

function likePost(id, btn) {
  var p = FEED.find(function(x){return x.id===id;});
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  btn.className = 'fact' + (p.liked?' liked':'');
  btn.innerHTML = (p.liked?'❤️':'🤍') + ' <span>' + p.likes + '</span>';
}

function doPost() {
  var area = document.getElementById('carea');
  var txt = area ? area.value.trim() : '';
  if (!txt) return;
  var ini = ME.name.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
  FEED.unshift({id:Date.now(), user:ME.username, display:ME.name, initials:ini,
    time:'gerade eben', text:txt, likes:0, liked:false, comments:[]});
  area.value = '';
  document.getElementById('feedlist').innerHTML = renderFeedHTML();
  ME.posts = (ME.posts||0) + 1;
}

// ══ COMMENTS ═════════════════════════════════════════════════
function openComments(id) {
  currentCommentId = id;
  var p = FEED.find(function(x){return x.id===id;});
  var html = p.comments.length ?
    p.comments.map(function(c) {
      return '<div class="citem"><div class="favatar" style="width:34px;height:34px;font-size:12px">' + c.user[0].toUpperCase() + '</div>' +
        '<div class="cbubble"><div class="cuser">@' + c.user + '</div><div class="ctext">' + c.text + '</div></div></div>';
    }).join('') :
    '<p style="color:var(--gray);text-align:center;margin-top:28px;font-size:14px">Noch keine Kommentare 🐉</p>';
  document.getElementById('clist').innerHTML = html;
  document.getElementById('cmodal').classList.add('open');
  var inp = document.getElementById('cinput');
  if (inp) inp.onkeydown = function(e){ if(e.key==='Enter') sendComment(); };
}

function closeComments() {
  document.getElementById('cmodal').classList.remove('open');
}

function sendComment() {
  var inp = document.getElementById('cinput');
  var txt = inp ? inp.value.trim() : '';
  if (!txt || !currentCommentId) return;
  var p = FEED.find(function(x){return x.id===currentCommentId;});
  p.comments.push({user: ME.username, text: txt});
  if (inp) inp.value = '';
  openComments(currentCommentId);
  document.getElementById('feedlist').innerHTML = renderFeedHTML();
}

  document.getElementById('prof-view').innerHTML =
    '<div class="prof-hero">' +
    '<button class="prof-back" onclick="closeProfile()">← Zurück</button>' +
    '<div class="prof-avbig">' + ini + '</div>' +
    '<div class="prof-name">' + ME.name + '</div>' +
    '<div class="prof-un">@' + ME.username + '</div>' +
    '<div class="prof-bio">' + (ME.bio||'') + '</div>' +
    '<div class="prof-stats">' +
    '<div class="pstat"><div class="pstat-num">' + (ME.posts||0) + '</div><div class="pstat-lbl">Posts</div></div>' +
    '<div class="pstat"><div class="pstat-num">0</div><div class="pstat-lbl">Follower</div></div>' +
    '<div class="pstat"><div class="pstat-num">' + (ME.joinedAt||'2026') + '</div><div class="pstat-lbl">Dabei seit</div></div>' +
    '</div></div>' +
    '<div class="edit-form">' +
    '<div class="ef-label">Anzeigename</div><input class="ef-input" id="ef-name" value="' + ME.name + '">' +
    '<div class="ef-label">Benutzername</div><input class="ef-input" id="ef-uname" value="' + ME.username + '">' +
    '<div class="ef-hint">@' + ME.username + ' · wird für Login verwendet</div>' +
    '<div class="ef-label">Bio</div><input class="ef-input" id="ef-bio" value="' + (ME.bio||'') + '" placeholder="Erzähl etwas über dich 🐉">' +
    '<div class="ef-label">E-Mail</div><input class="ef-input" value="' + ME.email + '" disabled style="opacity:.5">' +
    '<button class="ef-save" onclick="saveProfile()">ÄNDERUNGEN SPEICHERN</button>' +
    '<button class="ef-logout" onclick="doLogout()">Abmelden</button>' +
    '</div>';
}

function saveProfile() {
  var name = document.getElementById('ef-name').value.trim();
  var uname = document.getElementById('ef-uname').value.trim().replace('@','');
  var bio = document.getElementById('ef-bio').value.trim();
  if (!name || !uname) { alert('Pflichtfelder!'); return; }
  ME.name = name; ME.username = uname; ME.bio = bio;
  USERS[ME.email] = ME;
  alert('✅ Profil gespeichert!');
  renderProfileView();
}

function closeProfile() {
  document.getElementById('s-profile').classList.remove('active');
  document.getElementById('s-main').classList.add('active');
  renderUserPill();
}

function doLogout() {
  if (!confirm('Abmelden?')) return;
  ME = null; votedPoll = null;
  document.getElementById('s-profile').classList.remove('active');
  document.getElementById('s-main').classList.remove('active');
  document.getElementById('s-auth').classList.add('active');
  switchAuth('login');
  renderAuthForm('login');
}

// ══ INIT ═════════════════════════════════════════════════════
renderAuthForm('login');
</script>
</body>
</html>
